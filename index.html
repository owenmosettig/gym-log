<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Log</title>
  <meta name="description" content="Personal lift tracker. Works offline; data stays on your phone.">
  <meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Log">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view"></main>

  <nav class="tabs" aria-label="Main">
    <button data-action="tab" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5h2.5v5H3zM18.5 9.5H21v5h-2.5zM6 7h3v10H6zM15 7h3v10h-3zM9 11h6v2H9z" fill="currentColor"/></svg>
      <span>Today</span>
    </button>
    <button data-action="tab" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>History</span>
    </button>
    <button data-action="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 15l4.5-4.5 3.5 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Progress</span>
    </button>
    <button data-action="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="sheet" class="overlay sheet-wrap" hidden></div>
  <div id="dialog" class="overlay dialog-wrap" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <button id="update" class="update-pill" data-action="update" hidden>Update available — tap to refresh</button>
  <input id="import-file" type="file" accept="application/json,.json" hidden>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
